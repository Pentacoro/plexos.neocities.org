<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: black; 
        }
        figure {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        figcaption {
            margin-top: 8px;
            width: 100%;
            color: #2b2b2b;
            background-color: #dadada;
            font-size: .8em;
            padding: .4em;
            border-radius: 8px;
        }
    </style>
    <title>Ruffle Player</title>
</head>
<body>
    <div class="container">
        <figure>
            <embed src="./karate & ninja vs capoeira_escena 1.swf" width="550" height="400">   
            <figcaption>My very first flash animation, dating back to 2011 made by 11 year old me.</figcaption>
        </figure>
         
    </div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</body>
</html>
